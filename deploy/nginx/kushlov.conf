# Kushlov — Nginx reverse proxy (production VPS)
# Place under /etc/nginx/sites-available/kushlov and symlink into sites-enabled.
#
# Prerequisites on the Node/PM2 host:
#   app.set('trust proxy', 1)   # already set in apps/server/src/app.ts
# so req.ip / rate-limit keys use X-Forwarded-For from this proxy hop.

upstream kushlov_api {
    # PM2 cluster or single process listening on PORT (default 5000)
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream kushlov_web {
    # Next.js (pnpm start / PM2) — default 3000
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name klproind.com www.klproind.com;

    # Redirect HTTP → HTTPS (enable after certbot)
    # return 301 https://$host$request_uri;

    # --- Temporary HTTP until TLS is ready ---
    client_max_body_size 12m;

    # Health / API (Express) — no aggressive nginx limit_req on /health
    location = /health {
        proxy_pass http://kushlov_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://kushlov_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # REST API
    location /api/ {
        proxy_pass http://kushlov_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Next.js app (HTML + static / _next assets — not rate-limited by Express)
    location / {
        proxy_pass http://kushlov_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Long-cache Next static assets (optional)
    location /_next/static/ {
        proxy_pass http://kushlov_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

