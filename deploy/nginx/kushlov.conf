# Kushlov — Nginx reverse proxy (production VPS)
# Place under /etc/nginx/sites-available/kushlov and symlink into sites-enabled.
#
# Prerequisites on the Node/PM2 host:
#   app.set('trust proxy', 1)   # already set in apps/server/src/app.ts
# so req.ip / rate-limit keys use X-Forwarded-For from this proxy hop.

# Local Express (PM2). Prefer this when the process is healthy.
upstream kushlov_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# If local :5000 is down (nginx 502 on /api), either:
#   pm2 restart kushlov-api
# or temporarily proxy /api to the hosted API (uncomment the block at the bottom
# of the /api/ location and comment the local proxy_pass).

upstream kushlov_web {
    # Next.js (pnpm start / PM2) — default 3000
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name klproind.com www.klproind.com;

    # Redirect HTTP → HTTPS (enable after certbot)
    # return 301 https://$host$request_uri;

    # --- Temporary HTTP until TLS is ready ---
    client_max_body_size 12m;

    # Health / API (Express) — no aggressive nginx limit_req on /health
    location = /health {
        proxy_pass http://kushlov_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://kushlov_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # REST API → local Express. If you see 502 here, restart PM2:
    #   pm2 restart kushlov-api
    # Or switch proxy_pass to the hosted API (see commented alternative).
    location /api/ {
        proxy_pass http://kushlov_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # --- Fallback when local API is down (hosted Vercel API) ---
        # proxy_pass https://kushlov-server.vercel.app;
        # proxy_ssl_server_name on;
        # proxy_set_header Host kushlov-server.vercel.app;
    }

    # Next.js app (HTML + static / _next assets — not rate-limited by Express)
    location / {
        proxy_pass http://kushlov_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Firebase Google popup needs this (Chrome blocks window.closed otherwise).
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Long-cache Next static assets (optional)
    location /_next/static/ {
        proxy_pass http://kushlov_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

# Uncomment after certbot / TLS certs are in place:
#
# server {
#     listen 443 ssl http2;
#     server_name klproind.com www.klproind.com;
#
#     ssl_certificate     /etc/letsencrypt/live/klproind.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/klproind.com/privkey.pem;
#
#     client_max_body_size 12m;
#
#     # …same location blocks as above…
# }

# Required in http {} context (usually nginx.conf):
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
