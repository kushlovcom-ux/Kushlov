# EAS installs this app as a standalone project. Keep lifecycle scripts
# that Expo / Firebase need so `pnpm install --frozen-lockfile` succeeds.
packages:
  - '.'

overrides:
  expo-constants: 57.0.20

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@tailwindcss/oxide': true
  '@firebase/util': true
  protobufjs: true
